server:
  address: 127.0.0.1
  port: ${MALLSYSTEM_PORT:9991}
  shutdown: graceful

spring:
  application:
    name: mall-system
  datasource:
    url: jdbc:sqlite:${MALLSYSTEM_DB_PATH:${user.home}/.mallagent/mallagent.db}?busy_timeout=5000&foreign_keys=on
    username:
    password:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 10000
      pool-name: MallHikariPool
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        type: SYNC
        name: mall-system
        version: 0.0.1
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
